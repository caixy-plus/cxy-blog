{{- if and .IsPage (eq .Section "posts") (ne .Params.views false) (.Site.Params.article.views | default true) -}}
<script>
    (function () {
        var viewNode = document.getElementById('pageview_value');
        if (!viewNode) return;

        var path = viewNode.getAttribute('data-path') || window.location.pathname;
        var normalizedPath = path.replace(/\/index\.html$/, '/');
        if (normalizedPath.charAt(0) !== '/') normalizedPath = '/' + normalizedPath;

        fetch('/pageviews.json', { cache: 'no-store' })
            .then(function (response) {
                if (!response.ok) throw new Error('pageviews unavailable');
                return response.json();
            })
            .then(function (data) {
                var views = data.pages && data.pages[normalizedPath];
                viewNode.textContent = typeof views === 'number' ? views : 0;
            })
            .catch(function () {
                viewNode.textContent = '--';
            });
    })();
</script>
{{- end -}}
