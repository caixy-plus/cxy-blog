{{/*
  首页布局:博文优先
  顶部仅保留一行精简的站点标题与简介,紧接最新文章卡片,
  让访客第一眼就看到博文。布局名 "blog" 对应 hugo.toml 的 homepage.layout。
*/}}
<header class="mb-6">
  <h1 class="text-3xl font-extrabold text-neutral-800 dark:text-neutral-100 mb-1">
    {{ .Site.Title | emojify }}
  </h1>
  {{ with .Site.Params.description }}
    <p class="text-neutral-500 dark:text-neutral-400">{{ . | markdownify }}</p>
  {{ end }}
</header>

<section>
  {{ partial "recent-articles/main.html" . }}
</section>
