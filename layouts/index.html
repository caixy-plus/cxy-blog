{{ define "main" }}
<main class="px-6 py-12 max-w-4xl mx-auto">
  <header class="mb-12 text-center">
    <h1 class="text-4xl font-bold mb-4">VC 分享</h1>
    <p class="text-lg text-gray-600 dark:text-gray-400">记录开发实践、项目经验与技术思考</p>
  </header>

  <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
    {{ range site.RegularPages }}
    <article class="border rounded-lg overflow-hidden shadow-lg hover:shadow-xl transition-shadow">
      <div class="p-6">
        <h2 class="text-xl font-semibold mb-2">
          <a href="{{ .RelPermalink }}" class="hover:text-primary">{{ .Title }}</a>
        </h2>
        <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">{{ .Description }}</p>
        <time class="text-xs text-gray-500">{{ .Date.Format "2006-01-02" }}</time>
      </div>
    </article>
    {{ end }}
  </div>
</main>
{{ end }}
