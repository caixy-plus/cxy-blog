      <circle cx="8" cy="-2" r="5" fill="#fff7e9"/>
      <circle cx="5" cy="7" r="5" fill="#fff7e9"/>
      <circle cx="-5" cy="7" r="5" fill="#fff7e9"/>
      <circle cx="-8" cy="-2" r="5" fill="#fff7e9"/>
      <circle r="4" fill="#f5b83d"/>
    </g>
    <g id="wheel">
      <circle r="113" fill="#273744"/>
      <circle r="105" fill="#f8f8ed" stroke="#4b5960" stroke-width="5"/>
      <circle r="98" fill="none" stroke="#aab9bd" stroke-width="2"/>
      <g stroke="#9aa9ad" stroke-width="2">
