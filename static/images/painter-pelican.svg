     aria-labelledby="title desc">
  <title id="title">鹈鹕妈妈与宝宝的海滨双人自行车之旅</title>
  <desc id="desc">原创儿童绘本风格矢量插画：鹈鹕妈妈和宝宝骑着橙色双人自行车沿海滨道路旅行，背景有大海、灯塔、海鸟、草地和鲜花。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#63c9f4"/><stop offset="1" stop-color="#d9f5ff"/>
    </linearGradient>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#22a9cf"/><stop offset="1" stop-color="#0879a8"/>
    </linearGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop stop-color="#f7dfb4"/><stop offset="1" stop-color="#e8bd86"/>
    </linearGradient>
    <linearGradient id="orange" x2="0" y2="1">
      <stop stop-color="#ffb13b"/><stop offset="1" stop-color="#e96b16"/>
    </linearGradient>
    <linearGradient id="feather" x2="0" y2="1">
