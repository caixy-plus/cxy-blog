        <path d="M0 0L84 -50 M0 0L-84 50 M0 0L50 -84 M0 0L-50 84"/>
      </g>
      <circle r="9" fill="#68777b" stroke="#e8eeee" stroke-width="3"/>
      <circle r="3" fill="#f8f8ed"/>
    </g>
    <g id="gear">
      <circle r="31" fill="#59666b" stroke="#26343b" stroke-width="5"/>
      <circle r="23" fill="none" stroke="#aeb9b9" stroke-width="4"/>
      <circle r="8" fill="#d7dedb" stroke="#27353b" stroke-width="3"/>
      <g stroke="#c8d1ce" stroke-width="5" stroke-linecap="round">
        <path d="M0 -22V-8 M22 0H8 M0 22V8 M-22 0H-8"/>
      </g>
    </g>
    <g id="seagull" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">
