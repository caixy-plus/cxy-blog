      <path d="M535 540L540 610" stroke="#505f65" stroke-width="10"/>
      <path d="M735 548Q765 528 803 545L815 562Q775 576 740 565Z" fill="#38474d" stroke="#202d32" stroke-width="5"/>
      <path d="M775 565L785 610" stroke="#505f65" stroke-width="10"/>
    </g>

    <!-- 两套曲柄、齿盘和踏板 -->
    <g id="cranks">
