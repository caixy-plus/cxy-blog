      <path d="M700 730L760 565L850 620"/>
    </g>

    <!-- 前叉、车把与车把立管 -->
    <g id="handlebar" fill="none" stroke="#34434a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
