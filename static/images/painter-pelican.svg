        <use xlink:href="#gear"/>
        <path d="M0 0L-38 45" stroke="#38464c" stroke-width="12" stroke-linecap="round"/>
        <path d="M-55 48H-20" stroke="#202d32" stroke-width="12" stroke-linecap="round"/>
