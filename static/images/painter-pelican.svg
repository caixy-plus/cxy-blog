    <use xlink:href="#flower" transform="translate(480 715) scale(1.1)"/>
    <use xlink:href="#flower" transform="translate(980 690) scale(1.1)"/>
    <use xlink:href="#flower" transform="translate(1240 720) scale(.9)"/>
    <use xlink:href="#flower" transform="translate(1450 680) scale(1.1)"/>
