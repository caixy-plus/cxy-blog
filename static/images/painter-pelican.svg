    <g transform="translate(1160 730)"><use xlink:href="#wheel"/></g>

    <!-- 车架：后轮、后座管、前座管、头管与前叉 -->
    <g id="frame" fill="none" stroke="url(#orange)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
