        <circle r="17" fill="none" stroke="#c5ceca" stroke-width="4"/>
      </g>
    </g>

    <!-- 双人同步传动：前后链条与后轮飞轮，路径闭合 -->
    <g id="drivetrain" fill="none" stroke="#26343b" stroke-width="6" stroke-linecap="round">
